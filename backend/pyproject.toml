[project]
name = "haru-backend"
version = "0.1.0"
description = "Haru — 개인 투자자 워크플로우 OS 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "boto3>=1.43.93",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "black>=24.4",
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]
