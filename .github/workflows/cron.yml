name: haru-cron

# Amplify Hosting Compute의 30초 응답 한계를 피해
# GHA 런너에서 직접 브리핑·테마 생성 → S3 저장.
# Amplify 앱은 S3에서 읽기만 한다.

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST — 모닝
    - cron: "0 8 * * *" # 17:00 KST — 이브닝
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening"
        type: choice
        options:
          - morning
          - evening
        default: morning

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Resolve slot
        id: s
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          else
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cron worker
        env:
          STORAGE: s3
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY_PROD: ${{ secrets.KIS_APP_KEY_PROD }}
          KIS_APP_SECRET_PROD: ${{ secrets.KIS_APP_SECRET_PROD }}
        run: npx tsx scripts/run-cron.ts ${{ steps.s.outputs.slot }}
